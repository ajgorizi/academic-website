<helmet>
  <title>Contact | Amirsalar</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <style>
    .flash-reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.5s ease-out, transform 0.5s ease-out, background-color 0.4s ease-out; }
    .flash-reveal.is-in { opacity: 1; transform: translateY(0); }
    .flash-reveal.is-flash { background-color: var(--color-accent); transition: background-color 0.05s; }
  </style>
  <script>
    (function() {
      function reveal(el) {
        el.classList.add('is-flash');
        requestAnimationFrame(function() {
          el.classList.add('is-in');
          setTimeout(function() { el.classList.remove('is-flash'); }, 120);
        });
      }
      function observeAll() {
        var els = document.querySelectorAll('.flash-reveal:not([data-flash-observed])');
        if (!els.length) return;
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } });
        }, { threshold: 0.15 });
        els.forEach(function(el) { el.setAttribute('data-flash-observed', '1'); io.observe(el); });
      }
      observeAll();
      new MutationObserver(observeAll).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', observeAll);
    })();
  </script>
</helmet>
<div style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">
